# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF GraphQL IDOR (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask blog whose GraphQL API returns any user's private details by user id (GraphQL IDOR). The SKF lab folder python/graphql-IDOR is
# vendored unchanged in build/web/app/ and built by an overlay of its Dockerfile (build/web/Dockerfile).
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-graphql-idor

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.158.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 5000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/web

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: johndoe/password1 logs in and gets an X-Api-Key cookie
    script: checks/login.sh

message: |
  OWASP SKF GraphQL IDOR answers at {{ machines.web.ports.web.url }}.
  Log in as johndoe/password1, then look at what the settings page asks /graphql.
